services:
  mock-server:
    build:
      context: .
      dockerfile: Containerfile
    container_name: mock-server
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/config.yaml
    restart: unless-stopped
