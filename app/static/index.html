<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Server - Registration</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <span class="mock-badge">Mock Server</span>
            <h1>Registration</h1>
            <p>Name + photo capture. Visit date, time slot, and ticket category are set automatically.</p>
        </header>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="full_name" required placeholder="Enter full name">
            </div>

            <div class="form-section">
                <h2>Photo *</h2>
                <p class="section-info">Capture a photo with your webcam, or upload one instead.</p>

                <div class="camera-view" id="cameraView">
                    <video id="webcam" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <img id="capturedImage" style="display: none;" alt="Captured photo">
                </div>

                <div class="camera-controls">
                    <button type="button" class="btn btn-primary" id="startCamera">Start Camera</button>
                    <button type="button" class="btn btn-primary" id="capturePhoto" style="display: none;">Capture Photo</button>
                    <button type="button" class="btn btn-secondary" id="retakePhoto" style="display: none;">Retake</button>
                    <label class="btn btn-secondary" id="uploadLabel">
                        Upload Photo Instead
                        <input type="file" id="fileUpload" accept="image/*" style="display: none;">
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">Register</button>
                <button type="reset" class="btn btn-secondary" id="resetBtn">Clear</button>
            </div>
        </form>

        <div id="resultBox" class="result-box" style="display: none;"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
