server:
  host: "0.0.0.0"
  port: 8000

database:
  # lives inside the bind-mounted ./data directory (see compose.yml) so it
  # survives container restarts/rebuilds; the file itself is created on
  # startup by init_db() if it doesn't exist yet
  path: "/app/data/db.sqlite"

models:
  # bind-mounted from the host ./models directory, not baked into the image
  face_detector_path: "/app/models/face_detection_yunet_2023mar.onnx"
  face_recognizer_path: "/app/models/mobilefacenet.onnx"
  # letterbox size fed to YuNet before its manual multi-scale decode
  face_detector_input_size: 640
  face_detector_score_threshold: 0.5

identify:
  # max normalized-L2 distance between query and stored vector to count as a match
  face_recognition_threshold: 0.8
  fingerprint_recognition_threshold: 0.7
  default_n: 10
